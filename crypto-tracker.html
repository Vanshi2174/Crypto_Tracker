<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoTracker Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@600;800&display=swap" rel="stylesheet">
  <style>
/* Layout: centered title, one control bar, then a grid of price cards. Strictly black and white. */
:root {
  --bg: #000000;
  --card: #0d0d0d;
  --card-hover: #161616;
  --fg: #ffffff;
  --muted: #9a9a9a;
  --line: #2a2a2a;
  --line-strong: #ffffff;
  --font-display: 'Syne', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px 16px 56px;
}

/* Header */
.header { text-align: center; margin-bottom: 32px; }
.header h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.2rem, 6vw, 4rem);
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.header h1 span { color: transparent; -webkit-text-stroke: 1.5px var(--fg); }
.header p { color: var(--muted); margin-top: 10px; }
.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  font-size: 12px;
  color: var(--muted);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--fg); animation: pulse 1.6s ease-in-out infinite; }
.dot.sample { background: transparent; border: 1.5px solid var(--fg); }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6); }
  50% { box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); }
}

/* Controls */
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
}
.search {
  flex: 1 1 260px;
  max-width: 360px;
  font: inherit;
  color: var(--fg);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 11px 18px;
}
.search::placeholder { color: var(--muted); }
.search:focus { border-color: var(--fg); outline: none; }

.seg {
  display: flex;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
  max-width: 100%;
  overflow-x: auto;
}
.seg-btn {
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  white-space: nowrap;
}
.seg-btn:hover { color: var(--fg); }
.seg-btn.active { background: var(--fg); color: var(--bg); font-weight: 700; }

select, .refresh {
  font: inherit;
  color: var(--fg);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 16px;
  cursor: pointer;
}
select:hover, .refresh:hover { border-color: var(--fg); }
.refresh:disabled { opacity: 0.5; cursor: progress; }

:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.banner {
  max-width: 760px;
  margin: 0 auto 24px;
  border: 1px solid var(--fg);
  border-radius: 12px;
  padding: 12px 16px;
  text-align: center;
  font-size: 13px;
}

/* Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  cursor: pointer;
  text-align: left;
  color: inherit;
  font: inherit;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  animation: rise 0.45s ease both;
  animation-delay: calc(var(--i) * 35ms);
}
.card:hover {
  transform: translateY(-6px);
  border-color: var(--line-strong);
  background: var(--card-hover);
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.icon, .badge {
  width: 40px; height: 40px;
  border-radius: 50%;
  flex: none;
}
.icon { background: #fff; padding: 3px; object-fit: contain; }
.badge {
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--bg);
  background: var(--fg);
}
.names { min-width: 0; flex: 1; }
.names strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.names span { color: var(--muted); font-size: 12px; text-transform: uppercase; }
.rank {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 12px;
  color: var(--muted);
}

.price {
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}

/* Change pill: filled for gains, outlined for losses, so it reads without colour */
.chg {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 10px;
  border: 1px solid var(--fg);
}
.chg.up { background: var(--fg); color: var(--bg); }
.chg.down { background: transparent; color: var(--fg); }
.chg.flat { border-color: var(--line); color: var(--muted); }

.price-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.spark { display: block; width: 100%; height: 44px; color: var(--fg); }

.mini {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.mini div {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  min-width: 0;
}
.mini small {
  display: block;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.mini b { font-size: 13px; overflow-wrap: anywhere; }

.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }

/* Popup */
dialog {
  border: 0;
  background: transparent;
  color: var(--fg);
  max-width: 100vw;
  max-height: 100vh;
  margin: auto;
}
dialog::backdrop { background: rgba(0, 0, 0, 0.82); }
.modal-box {
  position: relative;
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--fg);
  border-radius: 20px;
  padding: 26px;
}
dialog[open] .modal-box { animation: pop 0.22s ease both; }
@keyframes pop {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.close {
  position: absolute;
  top: 12px; right: 14px;
  width: 36px; height: 36px;
  font-size: 24px;
  line-height: 1;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
}
.close:hover { background: var(--fg); color: var(--bg); }

.m-head { display: flex; align-items: center; gap: 14px; padding-right: 40px; }
.m-head h2 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
.m-sub { color: var(--muted); font-size: 12px; text-transform: uppercase; }
.m-price { font-size: 2.1rem; font-weight: 700; margin: 18px 0 4px; overflow-wrap: anywhere; }
.m-chart { margin: 12px 0 18px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.m-chart svg { display: block; width: 100%; height: 120px; color: var(--fg); }
.m-chart small { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; }
.m-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.m-stats div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.m-stats dt { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.m-stats dd { font-weight: 700; overflow-wrap: anywhere; }

@media (max-width: 520px) {
  .controls { flex-direction: column; align-items: stretch; }
  .search { max-width: none; }
  .seg { overflow-x: auto; }
  .m-stats { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .card, dialog[open] .modal-box, .dot.live { animation: none; }
  .card { transition: none; }
}

  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>CryptoTracker <span>Pro</span></h1>
      <p>Real-time prices for the top 20 cryptocurrencies</p>
      <div class="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></div>
    </header>

    <div class="controls">
      <input id="search" class="search" type="search" placeholder="Search cryptocurrencies…" autocomplete="off" aria-label="Search cryptocurrencies">

      <div class="seg" role="group" aria-label="Sort by">
        <button class="seg-btn active" data-sort="market_cap" type="button">Market Cap</button>
        <button class="seg-btn" data-sort="price" type="button">Price</button>
        <button class="seg-btn" data-sort="change24" type="button">24h %</button>
        <button class="seg-btn" data-sort="volume" type="button">Volume</button>
      </div>

      <select id="currency" aria-label="Currency">
        <option value="usd">USD $</option>
        <option value="inr">INR ₹</option>
        <option value="eur">EUR €</option>
      </select>

      <button id="refresh" class="refresh" type="button">↻ Refresh</button>
    </div>

    <div class="banner" id="banner" hidden></div>

    <main class="grid" id="grid"></main>
  </div>

  <dialog id="modal" aria-labelledby="mTitle">
    <div class="modal-box">
      <button class="close" id="close" type="button" aria-label="Close">×</button>
      <div class="m-head">
        <div id="mIcon"></div>
        <div>
          <h2 id="mTitle"></h2>
          <p class="m-sub" id="mSub"></p>
        </div>
      </div>
      <div class="m-price" id="mPrice"></div>
      <div id="mChart" class="m-chart"></div>
      <dl class="m-stats" id="mStats"></dl>
    </div>
  </dialog>

  <script>
'use strict';

const API_URL = 'https://api.coingecko.com/api/v3/coins/markets';
const REFRESH_MS = 60000;
const COUNT = 20;
const CURRENCIES = {
  usd: { symbol: '$', locale: 'en-US' },
  inr: { symbol: '₹', locale: 'en-IN' },
  eur: { symbol: '€', locale: 'de-DE' },
};
// Rough rates, used only for the offline sample data.
const SAMPLE_RATES = { usd: 1, inr: 83, eur: 0.92 };

function load(key, fallback) {
  try {
    const raw = localStorage.getItem('ctp.' + key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem('ctp.' + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
}

const state = {
  coins: [],
  query: '',
  sortKey: 'market_cap',
  currency: load('currency', 'usd'),
  loading: false,
  openId: null,
};
if (!CURRENCIES[state.currency]) state.currency = 'usd';

const $ = (id) => document.getElementById(id);
const els = {
  grid: $('grid'), search: $('search'), currency: $('currency'), refresh: $('refresh'),
  banner: $('banner'), dot: $('dot'), statusText: $('statusText'),
  modal: $('modal'), close: $('close'), mIcon: $('mIcon'), mTitle: $('mTitle'), mSub: $('mSub'),
  mPrice: $('mPrice'), mChart: $('mChart'), mStats: $('mStats'),
};

/* ---------- formatting ---------- */
function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function formatPrice(value) {
  if (value == null || isNaN(value)) return '—';
  const cur = CURRENCIES[state.currency];
  let digits = 2;
  if (value < 0.01) digits = 6;
  else if (value < 1) digits = 4;
  return cur.symbol + new Intl.NumberFormat(cur.locale, {
    minimumFractionDigits: digits, maximumFractionDigits: digits,
  }).format(value);
}

function formatBig(value, withSymbol = true) {
  if (value == null || isNaN(value)) return '—';
  const sym = withSymbol ? CURRENCIES[state.currency].symbol : '';
  const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  for (const [size, suffix] of units) {
    if (Math.abs(value) >= size) return sym + (value / size).toFixed(2) + suffix;
  }
  return sym + value.toFixed(0);
}

function changePill(value) {
  if (value == null || isNaN(value)) return '<span class="chg flat">—</span>';
  const cls = value > 0 ? 'up' : value < 0 ? 'down' : 'flat';
  const arrow = value > 0 ? '▲ +' : value < 0 ? '▼ ' : '';
  return `<span class="chg ${cls}">${arrow}${value.toFixed(2)}%</span>`;
}

function sparkSvg(points, big) {
  if (!points || points.length < 2) return '';
  const step = Math.max(1, Math.floor(points.length / 50));
  const data = points.filter((_, i) => i % step === 0);
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const w = 200, h = big ? 100 : 44, pad = 4;
  const coords = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  const area = `0,${h} ` + coords.join(' ') + ` ${w},${h}`;
  const last = coords[coords.length - 1].split(',');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="${big ? '' : 'spark'}" aria-hidden="true">
    <polygon points="${area}" fill="currentColor" opacity="0.12"/>
    <polyline points="${coords.join(' ')}" fill="none" stroke="currentColor" stroke-width="${big ? 1.8 : 1.5}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${Math.min(+last[0], w - 3)}" cy="${last[1]}" r="2.6" fill="currentColor"/>
  </svg>`;
}

function iconHtml(c, cls) {
  const letters = esc(c.symbol.slice(0, 3).toUpperCase());
  if (!c.image) return `<span class="badge">${letters}</span>`;
  return `<img class="${cls}" src="${esc(c.image)}" alt="" loading="lazy" width="40" height="40" data-fallback="${letters}">`;
}

/* ---------- data ---------- */
function normalize(raw) {
  return {
    id: raw.id,
    name: raw.name,
    symbol: raw.symbol,
    image: raw.image || '',
    rank: raw.market_cap_rank,
    price: raw.current_price,
    change24: raw.price_change_percentage_24h_in_currency ?? raw.price_change_percentage_24h,
    change7d: raw.price_change_percentage_7d_in_currency,
    market_cap: raw.market_cap,
    volume: raw.total_volume,
    high24: raw.high_24h,
    low24: raw.low_24h,
    supply: raw.circulating_supply,
    spark: raw.sparkline_in_7d ? raw.sparkline_in_7d.price : [],
  };
}

async function fetchLive() {
  const params = new URLSearchParams({
    vs_currency: state.currency,
    order: 'market_cap_desc',
    per_page: String(COUNT),
    page: '1',
    sparkline: 'true',
    price_change_percentage: '24h,7d',
  });
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);
  try {
    const res = await fetch(API_URL + '?' + params, { signal: controller.signal });
    if (!res.ok) {
      const err = new Error('HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }
    const json = await res.json();
    if (!Array.isArray(json) || !json.length) throw new Error('Empty response');
    return json.map(normalize);
  } finally {
    clearTimeout(timer);
  }
}

function describeError(err) {
  if (err && err.status === 429) return 'rate limited (HTTP 429), wait a minute and press Refresh';
  if (err && err.status === 401 || err && err.status === 403) return 'access refused (HTTP ' + err.status + '), the API may now need a key';
  if (err && err.status) return 'server answered HTTP ' + err.status;
  if (err && err.name === 'AbortError') return 'timed out';
  return 'request blocked or offline (network or CORS error)';
}

// Fallback source: Binance public market data. It needs no key and allows browser requests.
const BINANCE_COINS = [
  ['bitcoin', 'Bitcoin', 'BTC'], ['ethereum', 'Ethereum', 'ETH'], ['binancecoin', 'BNB', 'BNB'],
  ['solana', 'Solana', 'SOL'], ['ripple', 'XRP', 'XRP'], ['dogecoin', 'Dogecoin', 'DOGE'],
  ['tron', 'TRON', 'TRX'], ['cardano', 'Cardano', 'ADA'], ['avalanche-2', 'Avalanche', 'AVAX'],
  ['shiba-inu', 'Shiba Inu', 'SHIB'], ['the-open-network', 'Toncoin', 'TON'], ['polkadot', 'Polkadot', 'DOT'],
  ['chainlink', 'Chainlink', 'LINK'], ['bitcoin-cash', 'Bitcoin Cash', 'BCH'], ['litecoin', 'Litecoin', 'LTC'],
  ['uniswap', 'Uniswap', 'UNI'], ['stellar', 'Stellar', 'XLM'], ['near', 'NEAR Protocol', 'NEAR'],
  ['cosmos', 'Cosmos', 'ATOM'], ['ethereum-classic', 'Ethereum Classic', 'ETC'],
];

async function getJson(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) {
      const err = new Error('HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function fetchBinance() {
  const rate = SAMPLE_RATES[state.currency] || 1;
  const symbols = encodeURIComponent(JSON.stringify(BINANCE_COINS.map((c) => c[2] + 'USDT')));
  const tickers = await getJson('https://api.binance.com/api/v3/ticker/24hr?symbols=' + symbols);
  const bySymbol = {};
  tickers.forEach((t) => { bySymbol[t.symbol] = t; });

  // 7 days of 4 hour candles for each sparkline. A failed one just leaves that chart empty.
  const klines = await Promise.allSettled(BINANCE_COINS.map((c) =>
    getJson('https://api.binance.com/api/v3/klines?symbol=' + c[2] + 'USDT&interval=4h&limit=42')));

  return BINANCE_COINS.map((c, i) => {
    const t = bySymbol[c[2] + 'USDT'];
    if (!t) return null;
    const closes = klines[i].status === 'fulfilled' ? klines[i].value.map((k) => parseFloat(k[4]) * rate) : [];
    const first = closes.length ? closes[0] : null;
    const price = parseFloat(t.lastPrice) * rate;
    return {
      id: c[0], name: c[1], symbol: c[2].toLowerCase(), image: '', rank: i + 1,
      price,
      change24: parseFloat(t.priceChangePercent),
      change7d: first ? ((price - first) / first) * 100 : null,
      market_cap: null,
      volume: parseFloat(t.quoteVolume) * rate,
      high24: parseFloat(t.highPrice) * rate,
      low24: parseFloat(t.lowPrice) * rate,
      supply: null,
      spark: closes,
    };
  }).filter(Boolean);
}

function sampleSpark(seed, trend) {
  let s = seed;
  const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const out = [];
  let v = 100;
  for (let i = 0; i < 80; i++) { v += (rand() - 0.5) * 4 + trend / 80; out.push(v); }
  return out;
}

function sampleCoins() {
  // name, symbol, USD price, 24h %, 7d %, market cap USD, volume USD
  const base = [
    ['Bitcoin', 'btc', 67000, 1.2, 3.4, 1.32e12, 3.1e10],
    ['Ethereum', 'eth', 3400, -0.8, 2.1, 4.1e11, 1.6e10],
    ['Tether', 'usdt', 1.0, 0.0, 0.0, 1.1e11, 5.2e10],
    ['BNB', 'bnb', 590, 0.6, -1.2, 8.6e10, 1.4e9],
    ['Solana', 'sol', 165, 3.9, 8.5, 7.5e10, 3.2e9],
    ['USDC', 'usdc', 1.0, 0.0, 0.0, 3.4e10, 6.1e9],
    ['XRP', 'xrp', 0.52, -1.9, -4.0, 2.9e10, 1.1e9],
    ['Dogecoin', 'doge', 0.15, 5.2, 12.4, 2.2e10, 1.8e9],
    ['Toncoin', 'ton', 6.9, -2.4, 0.9, 1.7e10, 4.5e8],
    ['Cardano', 'ada', 0.45, -0.3, -2.8, 1.6e10, 3.9e8],
    ['Avalanche', 'avax', 35, 2.1, 5.7, 1.4e10, 5.1e8],
    ['Shiba Inu', 'shib', 0.000024, 1.4, 6.3, 1.4e10, 4.2e8],
    ['Polkadot', 'dot', 6.7, -1.1, -3.5, 9.4e9, 2.1e8],
    ['Chainlink', 'link', 14.2, 0.9, 4.4, 8.3e9, 3.6e8],
    ['TRON', 'trx', 0.12, 0.4, 1.9, 1.05e10, 3.3e8],
    ['Litecoin', 'ltc', 83, -0.5, 1.7, 6.2e9, 3.0e8],
    ['Bitcoin Cash', 'bch', 470, 1.8, -2.2, 9.3e9, 2.5e8],
    ['Uniswap', 'uni', 7.8, -2.9, -6.1, 5.9e9, 1.2e8],
    ['Stellar', 'xlm', 0.11, 0.2, 2.6, 3.2e9, 7.0e7],
    ['Monero', 'xmr', 160, -0.1, 0.8, 2.9e9, 6.0e7],
  ];
  const r = SAMPLE_RATES[state.currency];
  return base.map((b, i) => ({
    id: b[1], name: b[0], symbol: b[1], image: '', rank: i + 1,
    price: b[2] * r, change24: b[3], change7d: b[4],
    market_cap: b[5] * r, volume: b[6] * r,
    high24: b[2] * r * 1.02, low24: b[2] * r * 0.98,
    supply: b[5] / b[2],
    spark: sampleSpark(i * 97 + 13, b[4] * 3),
  }));
}

async function loadData() {
  if (state.loading) return;
  state.loading = true;
  els.refresh.disabled = true;
  setStatus('', 'Loading…');
  const errors = [];
  let source = '';
  const time = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  try {
    // Try each data source in order and use the first one that answers.
    for (const [name, fn] of [['CoinGecko', fetchLive], ['Binance', fetchBinance]]) {
      try {
        state.coins = await fn();
        source = name;
        break;
      } catch (err) {
        console.warn(name + ' failed:', err);
        errors.push(name + ': ' + describeError(err));
      }
    }

    if (source) {
      if (source === 'Binance') {
        els.banner.hidden = false;
        els.banner.textContent = 'CoinGecko did not respond (' + errors[0].replace('CoinGecko: ', '') + '), so prices come from Binance instead. Market cap and supply are not available from this source'
          + (state.currency === 'usd' ? '.' : ', and ' + state.currency.toUpperCase() + ' values are approximate conversions.');
      } else {
        els.banner.hidden = true;
      }
      setStatus('live', 'Live · ' + source + ' · ' + time());
    } else {
      state.coins = sampleCoins();
      els.banner.hidden = false;
      els.banner.textContent = 'Showing sample data, not live prices. ' + errors.join(' | ');
      setStatus('sample', 'Sample data');
    }
  } finally {
    state.loading = false;
    els.refresh.disabled = false;
  }
  render();
  if (els.modal.open && state.openId) fillModal(state.openId);
}

function setStatus(kind, text) {
  els.dot.className = 'dot' + (kind ? ' ' + kind : '');
  els.statusText.textContent = text;
}

/* ---------- render ---------- */
function visibleCoins() {
  const q = state.query.trim().toLowerCase();
  const key = state.sortKey;
  return state.coins
    .filter((c) => !q || c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q))
    .sort((a, b) => {
      // Sources without market cap (Binance) keep their list order, which is already by market cap.
      if (key === 'market_cap' && (a.market_cap == null || b.market_cap == null)) return (a.rank ?? 0) - (b.rank ?? 0);
      return (b[key] ?? -Infinity) - (a[key] ?? -Infinity);
    });
}

function render() {
  const list = visibleCoins();
  if (!list.length) {
    els.grid.innerHTML = '<p class="empty">No cryptocurrencies match your search.</p>';
    return;
  }
  els.grid.innerHTML = list.map((c, i) => `
    <article class="card" role="button" tabindex="0" data-id="${esc(c.id)}" style="--i:${i}" aria-label="Open details for ${esc(c.name)}">
      <div class="card-top">
        ${iconHtml(c, 'icon')}
        <div class="names"><strong>${esc(c.name)}</strong><span>${esc(c.symbol)}</span></div>
        <span class="rank">#${c.rank ?? '—'}</span>
      </div>
      <div class="price-row">
        <div class="price">${formatPrice(c.price)}</div>
        ${changePill(c.change24)}
      </div>
      ${sparkSvg(c.spark, false)}
      <div class="mini">
        <div><small>24h high</small><b>${formatPrice(c.high24)}</b></div>
        <div><small>24h low</small><b>${formatPrice(c.low24)}</b></div>
        <div><small>Volume</small><b>${formatBig(c.volume)}</b></div>
        <div><small>Market cap</small><b>${formatBig(c.market_cap)}</b></div>
      </div>
    </article>`).join('');
}

/* ---------- popup ---------- */
function fillModal(id) {
  const c = state.coins.find((x) => x.id === id);
  if (!c) return;
  els.mIcon.innerHTML = iconHtml(c, 'icon');
  els.mTitle.textContent = c.name;
  els.mSub.textContent = c.symbol + ' · rank #' + (c.rank ?? '—');
  els.mPrice.innerHTML = formatPrice(c.price) + ' ' + changePill(c.change24);

  const pts = c.spark || [];
  const lo = pts.length ? Math.min(...pts) : null;
  const hi = pts.length ? Math.max(...pts) : null;
  els.mChart.innerHTML = pts.length
    ? sparkSvg(pts, true) + `<small><span>7 day low ${formatPrice(lo)}</span><span>7 day high ${formatPrice(hi)}</span></small>`
    : '<small>No chart data available.</small>';

  const rows = [
    ['7d change', changePill(c.change7d)],
    ['Market cap', formatBig(c.market_cap)],
    ['Volume 24h', formatBig(c.volume)],
    ['Circulating supply', c.supply == null ? '—' : formatBig(c.supply, false) + ' ' + esc(c.symbol.toUpperCase())],
    ['24h high', formatPrice(c.high24)],
    ['24h low', formatPrice(c.low24)],
  ];
  els.mStats.innerHTML = rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
}

function openModal(id) {
  state.openId = id;
  fillModal(id);
  if (!els.modal.open) els.modal.showModal();
}

/* ---------- events ---------- */
els.search.addEventListener('input', (e) => { state.query = e.target.value; render(); });

document.querySelectorAll('.seg-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    state.sortKey = btn.dataset.sort;
    document.querySelectorAll('.seg-btn').forEach((b) => b.classList.toggle('active', b === btn));
    render();
  });
});

els.currency.value = state.currency;
els.currency.addEventListener('change', (e) => {
  state.currency = e.target.value;
  save('currency', state.currency);
  loadData();
});

els.refresh.addEventListener('click', loadData);

els.grid.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) openModal(card.dataset.id);
});
els.grid.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.card');
  if (!card) return;
  e.preventDefault();
  openModal(card.dataset.id);
});

els.close.addEventListener('click', () => els.modal.close());
els.modal.addEventListener('click', (e) => { if (e.target === els.modal) els.modal.close(); });
els.modal.addEventListener('close', () => { state.openId = null; });

// Swap a broken logo for a lettered badge.
document.addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.fallback) return;
  const span = document.createElement('span');
  span.className = 'badge';
  span.textContent = img.dataset.fallback;
  img.replaceWith(span);
}, true);

/* ---------- start ---------- */
loadData();
setInterval(() => { if (!document.hidden) loadData(); }, REFRESH_MS);

  </script>
</body>
</html>
